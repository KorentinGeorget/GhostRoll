services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ghostroll
      POSTGRES_USER: ghostroll
      POSTGRES_PASSWORD: ghostroll_secure_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghostroll -d ghostroll"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://ghostroll:${POSTGRES_PASSWORD:-ghostroll_secure_password}@db:5432/ghostroll
      COOKIE_SECRET: ${COOKIE_SECRET:-ghostroll-super-secret-cookie-key-production-32chars}
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://localhost:3001/health\").then(r => r.ok ? process.exit(0) : process.exit(1))'"]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: always
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "80"

volumes:
  pgdata:
