services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ghostroll
      POSTGRES_USER: ghostroll
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ghostroll_secure_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghostroll -d ghostroll"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - server_data:/app/data
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://ghostroll:${POSTGRES_PASSWORD:-ghostroll_secure_password}@db:5432/ghostroll
      PGLITE_DATA_DIR: /app/data/pglite
      COOKIE_SECRET: ${COOKIE_SECRET:-ghostroll-super-secret-cookie-key-production-32chars}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APP_URL: ${APP_URL:-}
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://127.0.0.1:3001/health\").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 25s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: always
    depends_on:
      - server
    ports:
      - "80"

volumes:
  pgdata:
    name: ghostroll_postgres_data
  server_data:
    name: ghostroll_server_data
